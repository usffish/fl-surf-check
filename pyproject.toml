[project]
name = "fl-surf-check"
version = "1.0.0"
description = "Rate Florida surf spots out of 10 and work out which are worth driving to."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ismail Jhaveri" }]
keywords = ["surf", "surfing", "florida", "weather", "forecast", "cli"]
dependencies = [
    "requests>=2.31",
    "openmeteo-requests>=1.3",
    "requests-cache>=1.2",
    "pgeocode>=0.4",
    "geopy>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
fl-surf-check = "fl_surf_check.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fl_surf_check*"]
